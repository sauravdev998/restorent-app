# Local development database. Same Postgres major version as RDS, per spec 0001.
# The API connects as app_api, never as the owner, so row level security applies to it.

services:
  db:
    image: postgres:17-alpine
    container_name: restaurant-db
    environment:
      POSTGRES_USER: restaurant_owner
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: restaurant
    ports:
      # 5432 and 5433 are taken by other projects on this machine.
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./api/scripts/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_owner -d restaurant"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
