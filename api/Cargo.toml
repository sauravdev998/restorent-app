[package]
name = "api"
version = "0.1.0"
edition = "2024"
description = "Restaurant operations platform API: JSON over HTTP plus a server sent event stream."
# Two binaries live here: `api` serves, `openapi` prints the API document.
# Naming the default keeps `cargo run` unambiguous.
default-run = "api"
publish = false

# Clippy pedantic, minus the two lints that fight this codebase rather than help
# it. Continuous integration runs clippy with `-D warnings`, so a warning here is
# a failed build, which is why each exception is argued rather than assumed.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# `try_recv` answers with a two state protocol signal: a notification, or the
# connection dropped and came back. Both arms carry real meaning and real
# commentary, and `None =>` is the label that commentary hangs off. `if let`
# with an `else` block would hide the second state behind an absence.
single_match_else = "allow"

[dependencies]
anyhow = "1"
# The password hash. `argon2id` at the crate's own default parameters, which is
# what the OWASP guidance points at, and computed off the async runtime because
# it is deliberately expensive.
argon2 = "0.5"
async-stream = "0.3.6"
axum = { version = "0.8", features = ["macros"] }
# The cookie jar the session token travels in. Session handling only: nothing
# here uses axum-extra for routing or extraction.
axum-extra = { version = "0.10", features = ["cookie"] }
# Encodes the 32 random session bytes for transport in a cookie. URL safe, so
# the value needs no further escaping.
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
dotenvy = "0.15.7"
futures = "0.3"
# Where the 32 session bytes come from: the operating system's cryptographic
# source, never a seeded generator.
rand = "0.9"
# Money is `NUMERIC` in Postgres and `Decimal` here, never a float. The `serde`
# feature is what lets a bill figure cross into a wire shape without a detour
# through a string in every DTO.
rust_decimal = { version = "1.38", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Hashes the session token for storage. A fast hash on purpose: the value is
# already 256 bits of entropy, and the column is looked up on every request.
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate", "rust_decimal", "ipnetwork"] }
thiserror = "2"
# Only for the cookie's `Max-Age`. The `cookie` crate behind `axum-extra` takes
# its own duration type, so naming the crate here is more honest than reaching
# for it through a re-export that could disappear in a patch release.
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-stream = "0.1.19"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# `chrono` is here so a `timestamptz` reaches the document as a `date-time`
# string rather than failing to have a schema at all. Every time on the wire is
# an instant in UTC; which clock a screen writes it in is the restaurant's
# timezone, decided on the web side.
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
# `v7` because Postgres 17 has no built in `uuidv7()`, so version 7 identifiers
# are generated here. They sort by creation time, which keeps the primary key
# index appending rather than scattering writes across it the way v4 does.
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[dev-dependencies]
# `test-util` only: it provides the paused clock the listener timeout test uses
# so that proving a 5 second bound does not cost 5 seconds on every test run.
tokio = { version = "1", features = ["test-util"] }
